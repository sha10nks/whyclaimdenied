<!doctype html>
<html lang="en">
  <head>
    <script>
      (() => {
        const allowedHosts = new Set(['whyclaimdenied.com', 'www.whyclaimdenied.com']);
        const isNonProductionHost = !allowedHosts.has(location.hostname);

        const doNotTrackEnabled =
          navigator.doNotTrack === '1' ||
          window.doNotTrack === '1' ||
          navigator.msDoNotTrack === '1' ||
          navigator.globalPrivacyControl === true;

        if (isNonProductionHost || doNotTrackEnabled) return;

        window.ezstandalone = window.ezstandalone || {};
        window.ezstandalone.cmd = window.ezstandalone.cmd || [];

        const loadScript = (src, { async = false, attributes = {} } = {}) =>
          new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = src;
            script.async = async;
            for (const [key, value] of Object.entries(attributes)) {
              script.setAttribute(key, value);
            }
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
          });

        loadScript('https://cmp.gatekeeperconsent.com/min.js', {
          attributes: { 'data-cfasync': 'false' },
        })
          .then(() =>
            loadScript('https://the.gatekeeperconsent.com/cmp.min.js', {
              attributes: { 'data-cfasync': 'false' },
            }),
          )
          .then(() => loadScript('https://www.ezojs.com/ezoic/sa.min.js', { async: true }))
          .catch(() => {});
      })();
    </script>
    <script>
      (() => {
        const allowedHosts = new Set(['whyclaimdenied.com', 'www.whyclaimdenied.com']);
        const isNonProductionHost = !allowedHosts.has(location.hostname);

        const doNotTrackEnabled =
          navigator.doNotTrack === '1' ||
          window.doNotTrack === '1' ||
          navigator.msDoNotTrack === '1' ||
          navigator.globalPrivacyControl === true;

        if (isNonProductionHost || doNotTrackEnabled) return;

        const measurementId = 'G-KPSWKNCJ7M';

        const gtagScript = document.createElement('script');
        gtagScript.async = true;
        gtagScript.src = `https://www.googletagmanager.com/gtag/js?id=${measurementId}`;
        document.head.appendChild(gtagScript);

        window.dataLayer = window.dataLayer || [];
        function gtag() {
          window.dataLayer.push(arguments);
        }
        window.gtag = gtag;

        gtag('js', new Date());
        gtag('config', measurementId, { anonymize_ip: true });
      })();
    </script>
