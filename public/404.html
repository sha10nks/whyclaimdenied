<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/favicon-32x32.svg" />
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon-16x16.svg" />
    <title>Page Not Found | WhyClaimDenied</title>
    <style>
      :root {
        --navy: #003366;
        --teal: #005670;
        --border: #e0e0e0;
        --text: #2a2a2a;
        --muted: #555;
        --bg: #ffffff;
        --radius: 14px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
        line-height: 1.7;
      }
      header {
        background: var(--navy);
        color: #fff;
        padding: 18px 0;
      }
      header .container {
        max-width: 860px;
        margin: 0 auto;
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      header img {
        height: 44px;
        width: auto;
      }
      header a { color: #fff; text-decoration: none; font-weight: 700; }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 40px 24px;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 22px;
        background: #fff;
      }
      h1 { margin: 0 0 12px; font-size: 2rem; letter-spacing: -0.02em; }
      p { margin: 0 0 16px; color: var(--muted); max-width: 75ch; }
      ul { margin: 12px 0 0; padding-left: 18px; }
      li { margin-bottom: 8px; }
      a { color: var(--teal); }
      a:hover { color: #003344; text-decoration: underline; }
      @media (max-width: 720px) {
        header img { height: 40px; }
        main { padding: 28px 18px; }
        .card { padding: 18px; }
        h1 { font-size: 1.75rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <a href="/" aria-label="WhyClaimDenied home">
          <img src="/Logo.svg" alt="WhyClaimDenied" />
        </a>
        <a href="/">WhyClaimDenied</a>
      </div>
    </header>

    <main>
      <div class="card">
        <h1>Page not found</h1>
        <p>The page you’re looking for doesn’t exist or may have been moved.</p>
        <ul>
          <li><a href="/">Back to the homepage</a></li>
          <li><a href="/#guides-by-state">Browse guides by state</a></li>
        </ul>
      </div>
    </main>
  </body>
</html>
